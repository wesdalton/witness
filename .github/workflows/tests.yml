name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]' -c requirements-dev.lock
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Grounding fixtures
        run: python -m research.pilots.scorer_integrity --output /tmp/witness-grounding.json
