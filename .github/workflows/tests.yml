name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]' -c requirements-dev.lock
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Sealed evidence audit
        run: python scripts/research_archive.py audit
      - name: Evidence coverage and ledger audit
        run: python scripts/audit_research_coverage.py
