[project]
name = "witness"
version = "0.3.0"
description = "Witness: a controlled benchmark of whether LLM auditors recognize when evidence cannot settle a claim about an agent run."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["witness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [
    "witness/evidence_access/tasks",  # benchmark fixtures; their bytes are evidence
    "research/experiments",  # frozen sources and exact agent artifacts
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
